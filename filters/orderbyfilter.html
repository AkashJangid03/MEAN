<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orderby filter</title>
</head>
<body>
    <div ng-app="myApp" ng-controller="namesCtrl">
        <p>Looping with object: </p>
        <ul>
            <li ng-repeat="x in names | orderBy:'country'">
                {{x.name + ', ' + x.country}}
            </li>
        </ul>
    </div>
    <script>
        amgular.module('myAPp', []).controller('namesCtrl', function($scope) {
            $scope.names = [
            {name:'Akash', country:'Norway'}, 
            {name:'Ajay', country:'America'}, 
            {name:'Rutik', country:'Japan'}, 
            {name:'Satyam', country:'Russia'}, 
            {name:'Kunal', country:'S.Korea'}
            ];
        });
    </script>
</body>
</html>
