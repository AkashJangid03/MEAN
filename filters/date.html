<!DOCTYPE html>
<html lang="en">
<head>
    <title>Date Filter</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-app="dateApp">
    <div ng-controller="DateController">
        <p>Current Date: {{ currentDate | date }}</p>
        <p>Formatted Date: {{ currentDate | date:'dd-MM-yyyy' }}</p>
        <p>Full Date: {{ currentDate | date:'fullDate' }}</p>
    </div>
    <script>
        let app = angular.module("dateApp", []);
        app.controller("DateController", function($scope) {
            $scope.currentDate = new Date();
        });
    </script>
</body>
</html>
