<!DOCTYPE html>
<body>
    <script src="angular.min.js"></script>
    <div ng-app="" ng-init="num">
        <p>num: <input type="number" ng-model="num"></p>
        <p>
            The num is <span ng-bind="num"></span>
        </p>
        <p> Square of <span ng-bind="num"></span> = {{num*num}} </p>
    </div>
</body> 
</html>
