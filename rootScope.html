<!DOCTYPE html>
<html>
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <title>Root Scope</title>
</head>
<body>
    <p>The root scope;s favitore color:</p>
    <h3>{{color}}</h3>
    <div ng-app="colorApp" ng-controller="colorCtrl">
        <p>The scope of the controller's favorite color: </p>
        <h3>{{color}}</h3>
    </div>
    <p>The root scope's favitore color:</p>
    <h3>{{color}}</h3>
    <script src="rootScopeColor.js"></script>
</body>
</html>
