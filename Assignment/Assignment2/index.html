<!DOCTYPE html>
<html lang="en" ng-app="liveTextApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <title>Document</title>
</head>
<body>
    <div ng-controller="LiveTextController">
        <label for="name">Type Your Name</label>
        <input type="text" name="name" id="name" ng-model="userMSG">
        <p>{{userMSG}}</p>
    </div>
    <script>
        let app = angular.module("liveTextApp",[]);

        app.controller("LiveTextController",function($scope){
            $scope.userMSG = "Hello!";
        })
    </script>
</body>
</html>
